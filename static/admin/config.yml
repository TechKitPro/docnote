backend:
  name: github
  repo: TechKitPro/docnote
  branch: main

# 图片等媒体文件上传位置
media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "docs"
    label: "文档"
    label_singular: "文档"
    folder: "docs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "URL 路径（slug）", name: "slug", widget: "string", required: false }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", required: false, value_type: "int" }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "blog"
    label: "博客"
    label_singular: "博客文章"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "URL 路径（slug）", name: "slug", widget: "string", required: false }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "作者", name: "authors", widget: "list", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "正文", name: "body", widget: "markdown" }
